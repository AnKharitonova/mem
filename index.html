:root {
  --paper: #f8f3e8;
  --ink: #302e29;
  --muted: #81796c;
  --accent: #b65e42;
  --line: #d9d0c0;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  background: radial-gradient(ellipse at 50% 10%, #f7f0e4, transparent 65%), #d9d0c1;
  color: var(--ink);
  font-family: 'Manrope', sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  overflow-x: hidden;
}

.topbar {
  width: 100%;
  padding: 18px 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  color: #655d51;
  font-size: 11px;
  letter-spacing: .13em;
  text-transform: uppercase;
}

.topbar strong {
  font-family: 'Playfair Display', serif;
  font-size: 16px;
  letter-spacing: .03em;
  text-transform: none;
  color: var(--ink);
}

.book-area {
  width: 100%;
  display: flex;
  flex: 1;
  justify-content: center;
  align-items: center;
  padding: 12px 20px 20px;
  perspective: 2200px;
}

.book {
  position: relative;
  width: min(850px, 92vw);
  height: min(680px, 76vh);
  min-height: 470px;
  transform-style: preserve-3d;
  filter: drop-shadow(0 20px 25px rgba(48, 39, 27, .18));
}

.sheet {
  position: absolute;
  inset: 0;
  transform-style: preserve-3d;
  transform-origin: left center;
  transition: transform .85s cubic-bezier(.2,.65,.25,1);
}

.sheet.flipped { transform: rotateY(-180deg); }

.page {
  position: absolute;
  inset: 0;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  background:
    linear-gradient(90deg, rgba(80,60,30,.035), transparent 7%, transparent 94%, rgba(80,60,30,.025)),
    var(--paper);
  border: 1px solid #e2d9c9;
  overflow: hidden;
  padding: 34px 42px;
}

.page.back {
  transform: rotateY(180deg);
  background:
    linear-gradient(270deg, rgba(80,60,30,.035), transparent 7%, transparent 94%, rgba(80,60,30,.025)),
    #f5efe3;
}

.page-inner {
  height: 100%;
  display: flex;
  flex-direction: column;
  position: relative;
  min-height: 0;
}

.page-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--line);
  color: var(--muted);
  font-size: 9px;
  letter-spacing: .15em;
  text-transform: uppercase;
}

.page-footer {
  margin-top: auto;
  padding-top: 10px;
  border-top: 1px solid var(--line);
  display: flex;
  justify-content: space-between;
  color: var(--muted);
  font-size: 9px;
  letter-spacing: .08em;
  flex-shrink: 0;
}

.cover {
  text-align: center;
  justify-content: center;
  align-items: center;
  background:

    var(--paper);
}

.cover .masthead {
  font-family: 'Playfair Display', serif;
  font-size: clamp(43px, 8vw, 76px);
  line-height: .98;
  font-weight: 800;
  letter-spacing: -.045em;
  max-width: 650px;
}

.cover .subtitle {
  font-family: 'Playfair Display', serif;
  font-size: 19px;
  font-style: italic;
  color: var(--accent);
  margin-top: 20px;
}

.cover .cover-line {
  width: 70px;
  height: 2px;
  background: var(--accent);
  margin: 22px auto;
}

.cover .cover-note {
  color: var(--muted);
  font-size: 12px;
  letter-spacing: .12em;
  text-transform: uppercase;
}

.cover .cover-decoration {
  font-size: 42px;
  margin-top: 20px;
  opacity: .8;
}

.cover .cover-police {
  width: min(190px, 42%);

  object-fit: contain;
  margin-top: 16px;
}

.cover .issue {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  font-size: 10px;
  color: var(--muted);
  letter-spacing: .12em;
}

.editorial {
  justify-content: center;
  text-align: center;
  padding: 20px 7%;
}

.editorial .small-title {
  color: var(--accent);
  text-transform: uppercase;
  letter-spacing: .2em;
  font-size: 10px;
  margin-bottom: 24px;
}

.editorial h2 {

  margin: 0 0 25px;
}

.editorial p {
  max-width: 460px;
  margin: 0 auto 14px;
  font-family: 'Playfair Display', serif;
  font-size: 17px;
  line-height: 1.75;
  color: #5c554b;
}

.editorial .ornament {
  font-size: 30px;
  margin-top: 22px;

}

.contents {

  margin: 12px auto 0;
  padding-top: 12px;
  border-top: 1px solid var(--line);
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 9px 18px;
  text-align: left;
}

.contents-item {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  color: #625a4f;
  font-size: 10px;
  line-height: 1.4;
}

.contents-item span:last-child {
  color: var(--accent);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.article-kicker {
  color: var(--accent);
  font-size: 9px;
  font-weight: 700;
  letter-spacing: .18em;
  text-transform: uppercase;
  margin: 12px 0 2px;

.article-page { gap: 12px; }

.article-title {

  margin: 14px 0 0;
}

.article-subtitle {
  color: var(--muted);
  font-size: 12px;
  margin-top: 4px;

.meme-frame {
  flex: 1;
  min-height: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 10px;
  background: rgba(255,255,255,.45);
  border: 1px solid #e7dfd1;
  position: relative;
}

.meme-frame img {
  display: block;
  max-width: 100%;
  max-height: 100%;
  width: auto;
  height: auto;
  object-fit: contain;
  cursor: zoom-in;
}

.meme-caption {
  text-align: center;
  font: italic 13px 'Playfair Display', serif;
  color: #82796c;
  margin: 0;
}

.two-memes {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  flex: 1;
  min-height: 0;
}

.two-memes .meme-frame { min-width: 0; }

.two-memes img {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
}
</style>

.hint {

function rubricFor(title) {
  if (/финанс|капитал|налог|токен|технолог|искусствен|пятилет|горизонт/i.test(title)) return 'Деньги и технологии';

    return `
      <div class="page-inner back-cover">
        <div class="cover-note">Конец выпуска</div>
        <h2>На этом мемы закончились, а жизнь продолжается!</h2>
        <p>
          Надеюсь, эта небольшая коллекция хотя бы пару раз
          заставила вас улыбнуться и помогла отвлечься
          от рабочих будней.
        </p>
        <p>
          Спасибо за совместную работу, помощь и время!
          Пусть впереди будет побольше интересных проектов,
          хороших людей, спокойных дедлайнов и поводов для смеха.
        </p>
        <p>Ну а если что — мемы всегда найдутся.</p>
        <div class="farewell-animals">
          <img src="assets/doodle-frog.svg" alt="Лягушка" loading="lazy">
          <img src="assets/doodle-duck.svg" alt="Уточка" loading="lazy">
          <img src="assets/doodle-cow.svg" alt="Коровка" loading="lazy">
        </div>
      </div>`;
  }

  if (data.type === 'two') {
    return `
      <div class="page-inner article-page">
        ${makeHeader()}
        <div>
          <div class="article-kicker">${rubricFor(data.title)}</div>
          <h2 class="article-title">${data.title}</h2>
          <div class="article-subtitle">${data.subtitle}</div>
        </div>
        <div class="two-memes">
          ${data.memes.map(number => memeBlock(number)).join('')}
        </div>
        ${makeFooter(pageNumber)}
      </div>`;
  }

  return `
    <div class="page-inner article-page">
      ${makeHeader()}
      <div>
        <div class="article-kicker">${rubricFor(data.title)}</div>
        <h2 class="article-title">${data.title}</h2>
        <div class="article-subtitle">${data.subtitle}</div>
      </div>
      ${memeBlock(data.memes[0])}
      ${makeFooter(pageNumber)}
    </div>`;
}

const book = document.getElementById('book');
const counter = document.getElementById('counter');
const progressBar = document.getElementById('progressBar');

const sheets = [];

for (let i = 0; i < pages.length; i++) {
  const sheet = document.createElement('div');
  sheet.className = 'sheet';

  const front = document.createElement('div');
  front.className = 'page front';
  front.innerHTML = makePage(pages[i], i + 1);

  const back = document.createElement('div');
  back.className = 'page back';
  back.innerHTML = '<div class="page-inner"></div>';

  sheet.append(front, back);
  book.appendChild(sheet);
  sheets.push(sheet);
}

let currentSheet = 0;

sheets.forEach((sheet, index) => {
  sheet.style.zIndex = sheets.length - index;
});

function updateBook() {
  sheets.forEach((sheet, index) => {
    sheet.classList.toggle('flipped', index < currentSheet);
    sheet.classList.toggle('active', index === currentSheet);
    sheet.style.zIndex = index === currentSheet ? 1 : 0;
  });

  const currentPage = Math.min(currentSheet + 1, pages.length);
  counter.textContent = currentSheet === 0
    ? 'Обложка · 1 / ' + pages.length
    : `${currentPage} / ${pages.length}`;

  progressBar.style.width = `${(currentSheet / sheets.length) * 100}%`;
}

function nextPage() {
  if (currentSheet >= sheets.length - 1) return;
  currentSheet++;
  updateBook();
}

function prevPage() {
  if (currentSheet <= 0) return;
  currentSheet--;
  updateBook();
}

document.addEventListener('keydown', event => {
  if (event.key === 'ArrowRight') nextPage();
  if (event.key === 'ArrowLeft') prevPage();
});

let touchStartX = 0;
let touchStartY = 0;
let touchStartedOnControl = false;

book.addEventListener('touchstart', event => {
  touchStartedOnControl = Boolean(
    event.target.closest('button, a, .reactions, [data-zoom]')
  );
  touchStartX = event.changedTouches[0].screenX;
  touchStartY = event.changedTouches[0].screenY;
}, { passive: true });

book.addEventListener('touchend', event => {
  if (touchStartedOnControl ||
      event.target.closest('button, a, .reactions, [data-zoom]')) {
    touchStartedOnControl = false;
    return;
  }

  const deltaX = event.changedTouches[0].screenX - touchStartX;
  const deltaY = event.changedTouches[0].screenY - touchStartY;

  if (Math.abs(deltaX) < 55 || Math.abs(deltaX) < Math.abs(deltaY)) return;

  if (deltaX < 0) nextPage();
  else prevPage();
}, { passive: true });

const zoom = document.getElementById('zoom');
const zoomImage = document.getElementById('zoomImage');

book.addEventListener('click', event => {
  const img = event.target.closest('[data-zoom]');
  if (!img) return;

  zoomImage.src = img.src;
  zoom.classList.add('open');
});

zoom.addEventListener('click', () => {
  zoom.classList.remove('open');
  zoomImage.src = '';
});

const reactionCounts = new Map();
const myReactions = new Map();
let authReady = false;
let reactionsChannel = null;

function setStatus(memeId, message) {
  const el = book.querySelector(
    `[data-status-for="${CSS.escape(String(memeId))}"]`
  );
  if (el) el.textContent = message || '';
}

function renderReactionGroup(memeId) {
  const id = String(memeId);
  const group = book.querySelector(
    `[data-meme-id="${CSS.escape(id)}"]`
  );
  if (!group) return;

  const counts = reactionCounts.get(id) || {};
  const selected = myReactions.get(id) || new Set();

  group.querySelectorAll('.reaction').forEach(button => {
    const emoji = button.dataset.emoji;
    const isSelected = selected.has(emoji);

    button.classList.toggle('selected', isSelected);
    button.querySelector('.count').textContent = counts[emoji] || 0;
    button.setAttribute('aria-pressed', String(isSelected));
  });
}

function renderAllReactionGroups() {
  book.querySelectorAll('[data-meme-id]').forEach(group => {
    renderReactionGroup(group.dataset.memeId);
  });
}
  async function ensureAnonymousSession() {
  const { data: sessionData, error: sessionError } =
    await supabaseClient.auth.getSession();

  if (sessionError) throw sessionError;
  if (sessionData.session) return;

  const { error } = await supabaseClient.auth.signInAnonymously();
  if (error) throw error;
}

async function loadAllReactionCounts() {
  const { data, error } = await supabaseClient.rpc(
    'get_all_meme_reaction_counts'
  );
  if (error) throw error;

  reactionCounts.clear();

  (data || []).forEach(row => {
    const id = String(row.meme_id);

    if (!reactionCounts.has(id)) reactionCounts.set(id, {});
    reactionCounts.get(id)[row.emoji] = Number(row.count) || 0;
  });

  renderAllReactionGroups();
}

async function loadMyReactions() {
  const { data, error } = await supabaseClient.rpc(
    'get_my_meme_reactions'
  );
  if (error) throw error;

  myReactions.clear();

  (data || []).forEach(row => {
    const id = String(row.meme_id);

    if (!myReactions.has(id)) myReactions.set(id, new Set());
    myReactions.get(id).add(row.emoji);
  });

  renderAllReactionGroups();
}

async function refreshReactionData() {
  await Promise.all([
    loadAllReactionCounts(),
    loadMyReactions()
  ]);
}

const reactionRequests = new Set();

async function chooseReaction(memeId, emoji) {
  if (!authReady) return;

  const id = String(memeId);
  const requestKey = `${id}:${emoji}`;

  if (reactionRequests.has(requestKey)) return;
  reactionRequests.add(requestKey);

  const selected = myReactions.get(id) || new Set();
  const wasSelected = selected.has(emoji);
  const nextSelected = new Set(selected);

  if (wasSelected) nextSelected.delete(emoji);
  else nextSelected.add(emoji);

  myReactions.set(id, nextSelected);

  const counts = { ...(reactionCounts.get(id) || {}) };
  counts[emoji] = Math.max(
    0,
    (Number(counts[emoji]) || 0) + (wasSelected ? -1 : 1)
  );

  reactionCounts.set(id, counts);
  renderReactionGroup(id);
  setStatus(id, 'Сохраняю…');

  try {
    const { error } = await supabaseClient.rpc(
      wasSelected ? 'remove_meme_reaction' : 'set_meme_reaction',
      {
        p_meme_id: id,
        p_emoji: emoji
      }
    );

    if (error) throw error;
    setStatus(id, '');

  } catch (error) {
    myReactions.set(id, selected);

    const rollbackCounts = { ...(reactionCounts.get(id) || {}) };
    rollbackCounts[emoji] = Math.max(
      0,
      (Number(rollbackCounts[emoji]) || 0) + (wasSelected ? 1 : -1)
    );

    reactionCounts.set(id, rollbackCounts);
    renderReactionGroup(id);
    setStatus(id, 'Не удалось сохранить реакцию');

    console.error('Supabase reaction RPC error:', error);

  } finally {
    reactionRequests.delete(requestKey);
  }
}

book.addEventListener('click', event => {
  const button = event.target.closest('.reaction');
  if (!button) return;

  const group = button.closest('[data-meme-id]');
  if (!group) return;

  chooseReaction(group.dataset.memeId, button.dataset.emoji);
});

async function initReactions() {
  try {
    await ensureAnonymousSession();
    authReady = true;

    await refreshReactionData();

    reactionsChannel = supabaseClient
      .channel('meme-reactions')
      .on(
        'broadcast',
        { event: 'reaction_counts' },
        ({ payload }) => {
          const memeId = payload?.meme_id;
          if (memeId == null) return;

          reactionCounts.set(String(memeId), payload.counts || {});
          renderReactionGroup(memeId);
        }
      )
      .subscribe(status => {
        if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') {
          console.warn('Supabase Broadcast subscription status:', status);
        }
      });

  } catch (error) {
    authReady = false;
    console.error('Supabase reactions initialization error:', error);

    book.querySelectorAll('[data-meme-id]').forEach(group => {
      setStatus(group.dataset.memeId, 'Не удалось подключиться к реакциям');
    });
  }
}

initReactions();
updateBook();
</script>
</body>
</html>
