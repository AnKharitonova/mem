<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#e8e0d1">
<title>Внеплановый выпуск</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Manrope:wght@400;500;600;700&display=swap');

:root {
  --paper: #f8f3e8;
  --ink: #302e29;
  --muted: #81796c;
  --accent: #b65e42;
  --line: #d9d0c0;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(ellipse at 50% 10%, #f7f0e4, transparent 65%),
    #d9d0c1;
  color: var(--ink);
  font-family: 'Manrope', sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  overflow-x: hidden;
}

.topbar {
  width: 100%;
  padding: 18px 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  color: #655d51;
  font-size: 11px;
  letter-spacing: .13em;
  text-transform: uppercase;
}

.topbar strong {
  font-family: 'Playfair Display', serif;
  font-size: 16px;
  letter-spacing: .03em;
  text-transform: none;
  color: var(--ink);
}

.book-area {
  width: 100%;
  display: flex;
  flex: 1;
  justify-content: center;
  align-items: center;
  padding: 12px 20px 20px;
  perspective: 2200px;
}

.book {
  position: relative;
  width: min(850px, 92vw);
  height: min(680px, 76vh);
  min-height: 470px;
  transform-style: preserve-3d;
  filter: drop-shadow(0 20px 25px rgba(48, 39, 27, .18));
}

.sheet {
  position: absolute;
  inset: 0;
  transform-style: preserve-3d;
  transform-origin: left center;
  transition: transform .85s cubic-bezier(.2,.65,.25,1);
}

.sheet.flipped {
  transform: rotateY(-180deg);
}

.page {
  position: absolute;
  inset: 0;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  background:
    linear-gradient(90deg, rgba(80,60,30,.035), transparent 7%, transparent 94%, rgba(80,60,30,.025)),
    var(--paper);
  border: 1px solid #e2d9c9;
  overflow: hidden;
  padding: 34px 42px;
}

.page.back {
  transform: rotateY(180deg);
  background:
    linear-gradient(270deg, rgba(80,60,30,.035), transparent 7%, transparent 94%, rgba(80,60,30,.025)),
    #f5efe3;
}

.page-inner {
  height: 100%;
  display: flex;
  flex-direction: column;
  position: relative;
}

.page-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--line);
  color: var(--muted);
  font-size: 9px;
  letter-spacing: .15em;
  text-transform: uppercase;
}

.page-footer {
  margin-top: auto;
  padding-top: 10px;
  border-top: 1px solid var(--line);
  display: flex;
  justify-content: space-between;
  color: var(--muted);
  font-size: 9px;
  letter-spacing: .08em;
}

.cover {
  text-align: center;
  justify-content: center;
  align-items: center;
  background:
    radial-gradient(ellipse at center, rgba(182,94,66,.08), transparent 55%),
    var(--paper);
}

.cover .masthead {
  font-family: 'Playfair Display', serif;
  font-size: clamp(43px, 8vw, 76px);
  line-height: .98;
  font-weight: 800;
  letter-spacing: -.045em;
  max-width: 650px;
}

.cover .subtitle {
  font-family: 'Playfair Display', serif;
  font-size: 19px;
  font-style: italic;
  color: var(--accent);
  margin-top: 25px;
}

.cover .cover-line {
  width: 70px;
  height: 2px;
  background: var(--accent);
  margin: 27px auto;
}

.cover .cover-note {
  color: var(--muted);
  font-size: 12px;
  letter-spacing: .12em;
  text-transform: uppercase;
}

.cover .cover-decoration {
  font-size: 42px;
  margin-top: 40px;
  opacity: .8;
}

.cover .issue {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  font-size: 10px;
  color: var(--muted);
  letter-spacing: .12em;
}

.editorial {
  justify-content: center;
  text-align: center;
  padding: 20px 7%;
}

.editorial .small-title {
  color: var(--accent);
  text-transform: uppercase;
  letter-spacing: .2em;
  font-size: 10px;
  margin-bottom: 24px;
}

.editorial h2 {
  font: 700 clamp(28px, 4vw, 43px)/1.15 'Playfair Display', serif;
  margin: 0 0 25px;
}

.editorial p {
  max-width: 460px;
  margin: 0 auto 14px;
  font-family: 'Playfair Display', serif;
  font-size: 17px;
  line-height: 1.75;
  color: #5c554b;
}

.editorial .ornament {
  font-size: 30px;
  margin-top: 22px;
  color: var(--accent);
}

.article-page {
  gap: 14px;
}

.article-title {
  font: 700 clamp(22px, 3.3vw, 32px)/1.2 'Playfair Display', serif;
  margin: 18px 0 0;
}

.article-subtitle {
  color: var(--muted);
  font-size: 12px;
  margin-top: 4px;
}

.meme-frame {
  flex: 1;
  min-height: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 10px;
  background: rgba(255,255,255,.45);
  border: 1px solid #e7dfd1;
  position: relative;
}

.meme-frame img {
  display: block;
  max-width: 100%;
  max-height: 100%;
  width: auto;
  height: auto;
  object-fit: contain;
  cursor: zoom-in;
}

.meme-caption {
  text-align: center;
  font: italic 13px 'Playfair Display', serif;
  color: #82796c;
  margin: 0;
}

.two-memes {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  flex: 1;
  min-height: 0;
}

.two-memes .meme-frame {
  min-width: 0;
}

.two-memes img {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
}

.back-cover {
  justify-content: center;
  align-items: center;
  text-align: center;
  background:
    radial-gradient(ellipse at center, rgba(182,94,66,.08), transparent 60%),
    var(--paper);
}

.back-cover h2 {
  font: 700 38px 'Playfair Display', serif;
}

.back-cover p {
  max-width: 390px;
  color: var(--muted);
  font: italic 17px/1.7 'Playfair Display', serif;
}

.controls {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 20px;
  padding: 0 16px 22px;
}

.nav-button {
  border: 1px solid #bfb5a5;
  background: rgba(248,243,232,.85);
  color: var(--ink);
  padding: 11px 20px;
  border-radius: 30px;
  cursor: pointer;
  font-size: 12px;
  transition: .2s;
}

.nav-button:hover:not(:disabled) {
  background: var(--ink);
  color: var(--paper);
}

.nav-button:disabled {
  opacity: .35;
  cursor: default;
}

.page-counter {
  min-width: 95px;
  text-align: center;
  color: #71695e;
  font-size: 11px;
  letter-spacing: .1em;
}

.progress {
  width: min(240px, 50vw);
  height: 2px;
  background: #cfc5b5;
  margin: 0 auto 22px;
  overflow: hidden;
}

.progress-bar {
  height: 100%;
  width: 0;
  background: var(--accent);
  transition: width .4s;
}

.zoom {
  position: fixed;
  inset: 0;
  z-index: 20;
  background: rgba(28,26,23,.93);
  display: none;
  justify-content: center;
  align-items: center;
  padding: 25px;
  cursor: zoom-out;
}

.zoom.open { display: flex; }

.zoom img {
  max-width: 95vw;
  max-height: 92vh;
  object-fit: contain;
}

.hint {
  color: #807769;
  font-size: 10px;
  text-align: center;
  padding-bottom: 14px;
}

@media (max-width: 600px) {
  .topbar {
    padding: 13px 15px;
    font-size: 9px;
  }

  .topbar strong { font-size: 14px; }

  .book-area { padding: 5px 10px 15px; }

  .book {
    width: 94vw;
    height: min(680px, 72vh);
    min-height: 430px;
  }

  .page { padding: 22px 19px; }

  .cover .masthead { font-size: clamp(39px, 11vw, 62px); }

  .cover .subtitle { font-size: 16px; }

  .article-title { font-size: 23px; }

  .article-subtitle { font-size: 10px; }

  .meme-caption { font-size: 11px; }

  .two-memes { gap: 6px; }

  .controls { gap: 10px; }

  .nav-button {
    padding: 10px 14px;
    font-size: 11px;
  }

  .page-counter {
    min-width: 65px;
    font-size: 10px;
  }
}
</style>
</head>

<body>

<div class="topbar">
  <strong>Внеплановый выпуск</strong>
  <span>Специальное издание · № 01</span>
</div>

<div class="book-area">
  <div class="book" id="book"></div>
</div>

<div class="progress">
  <div class="progress-bar" id="progressBar"></div>
</div>

<div class="controls">
  <button class="nav-button" id="prev">← Назад</button>
  <div class="page-counter" id="counter">Обложка</div>
  <button class="nav-button" id="next">Далее →</button>
</div>

<div class="hint">Листай кнопками, стрелками клавиатуры или свайпом</div>

<div class="zoom" id="zoom">
  <img src="" alt="Увеличенное изображение" id="zoomImage">
</div>

<script>
const pages = [
  {
    type: 'cover'
  },
  {
    type: 'editorial',
    title: 'В этом выпуске',
    text: 'Немного рабочих хроник, карьерных перспектив, финансовых открытий и наблюдений за окружающей действительностью.',
    second: 'Всё, что хотелось сказать, но иногда проще показать картинкой.',
    ornament: '✳'
  },

  {
    title: 'Рабочие будни',
    subtitle: 'Когда обычный день снова оказался не таким уж обычным',
    memes: [1]
  },
  {
    title: 'Новые вводные',
    subtitle: 'Постановка задач и тонкости рабочего процесса',
    memes: [3]
  },
  {
    title: 'Удалёнка с нюансами',
    subtitle: 'Офис, дом и всё, что между ними',
    memes: [6]
  },
  {
    title: 'Рабочая атмосфера',
    subtitle: 'Условия, ожидания и комментарии из жизни',
    memes: [7]
  },
  {
    title: 'Вакансия мечты',
    subtitle: 'Карьерные перспективы бывают неожиданными',
    memes: [8]
  },

  {
    title: 'Вопросы трудоустройства',
    subtitle: 'Ожидания и реальность',
    memes: [22]
  },
  {
    title: 'Ценность специалиста',
    subtitle: 'Иногда лучше просто взять паузу',
    memes: [23]
  },
  {
    title: 'Планы на рост',
    subtitle: 'Когда цели компании звучат особенно амбициозно',
    memes: [25]
  },
  {
    title: 'Мотивация',
    subtitle: 'Работа, зарплата и замкнутые круги',
    memes: [26]
  },
  {
    title: 'Срочность',
    subtitle: 'Вчера было бы идеально',
    memes: [28]
  },

  {
    title: 'Финансовые вопросы',
    subtitle: 'Попытки обращаться с деньгами разумно',
    memes: [4]
  },
  {
    title: 'Интеллектуальный капитал',
    subtitle: 'Когда ресурсов не хватает ни с одной стороны',
    memes: [5]
  },
  {
    title: 'Налог на продуктивность',
    subtitle: 'Экономические открытия',
    memes: [15]
  },

  {
    title: 'Технологическое будущее',
    subtitle: 'Мы в безопасности. Наверное.',
    memes: [10]
  },
  {
    title: 'Искусственный интеллект',
    subtitle: 'Новые технологии и старые вопросы',
    memes: [11]
  },
  {
    title: 'Токены и аппетиты',
    subtitle: 'Когда технологии дорожают',
    memes: [14]
  },
  {
    title: 'Пятилетний план',
    subtitle: 'Кем мы видим себя в будущем?',
    memes: [18]
  },
  {
    title: 'Новые горизонты',
    subtitle: 'Будущее обещает быть интересным',
    memes: [27]
  },

  {
    title: 'Особая рубрика: коты',
    subtitle: 'У них тоже есть профессиональное мнение',
    memes: [9]
  },
  {
    title: 'Наблюдения из жизни',
    subtitle: 'Иногда достаточно просто посмотреть',
    memes: [12]
  },
  {
    title: 'Всё будет хорошо',
    subtitle: 'Но, возможно, не совсем просто',
    memes: [13]
  },
  {
    title: 'Любимое занятие',
    subtitle: 'Выходные — время важных дел',
    memes: [16]
  },
  {
    title: 'Философия безделья',
    subtitle: 'Некоторые достижения не нуждаются в отчёте',
    memes: [19]
  },
  {
    title: 'Специалисты на месте',
    subtitle: 'Всё под контролем. Почти.',
    memes: [20]
  },
  {
    title: 'Жизнь в деталях',
    subtitle: 'У каждого свои обстоятельства',
    memes: [21]
  },

  {
    title: 'Взгляд со стороны',
    subtitle: 'Когда пытаешься осмыслить происходящее',
    memes: [17]
  },
  {
    title: 'Важный вопрос',
    subtitle: 'О работе, смысле и прекрасном',
    memes: [24]
  },

  {
    type: 'two',
    title: 'Тигриная мудрость',
    subtitle: 'Две важные публикации о жизни и инициативе',
    memes: [2, 29]
  },
  {
    type: 'back'
  }
];

const book = document.getElementById('book');
const counter = document.getElementById('counter');
const progressBar = document.getElementById('progressBar');
const prevButton = document.getElementById('prev');
const nextButton = document.getElementById('next');

function assetPath(number) {
  const name = String(number).padStart(2, '0');
  const extension = number >= 27 ? 'jpg' : 'png';
  return `assets/meme-${name}.${extension}`;
}

function makeHeader(pageNumber) {
  return `
    <div class="page-header">
      <span>Внеплановый выпуск</span>
      <span>Специальное издание</span>
    </div>
  `;
}

function makeFooter(pageNumber) {
  return `
    <div class="page-footer">
      <span>Хроники одной рабочей эпохи</span>
      <span>${pageNumber}</span>
    </div>
  `;
}

function makeMeme(number) {
  return `<img src="${assetPath(number)}" alt="Мем ${number}" loading="lazy" data-zoom>`;
}

function makePage(data, pageNumber) {
  if (data.type === 'cover') {
    return `
      <div class="page-inner cover">
        <div class="cover-note">Специальное издание</div>
        <div class="masthead">ВНЕПЛАНОВЫЙ<br>ВЫПУСК</div>
        <div class="cover-line"></div>
        <div class="subtitle">Хроники, наблюдения и другие важные события</div>
        <div class="cover-decoration">✳</div>
        <div class="issue">29 ИЛЛЮСТРАЦИЙ · ОДНА НЕПРОСТАЯ ЭПОХА</div>
      </div>
    `;
  }

  if (data.type === 'editorial') {
    return `
      <div class="page-inner editorial">
        ${makeHeader(pageNumber)}
        <div class="small-title">От редакции</div>
        <h2>${data.title}</h2>
        <p>${data.text}</p>
        <p>${data.second}</p>
        <div class="ornament">${data.ornament}</div>
        ${makeFooter(pageNumber)}
      </div>
    `;
  }

  if (data.type === 'back') {
    return `
      <div class="page-inner back-cover">
        <div class="cover-note">Конец выпуска</div>
        <h2>До новых встреч!</h2>
        <p>Пусть впереди будет много интересных историй, хороших людей и поводов для улыбки.</p>
        <div class="cover-decoration">✳</div>
      </div>
    `;
  }

  if (data.type === 'two') {
    return `
      <div class="page-inner article-page">
        ${makeHeader(pageNumber)}
        <div>
          <h2 class="article-title">${data.title}</h2>
          <div class="article-subtitle">${data.subtitle}</div>
        </div>
        <div class="two-memes">
          ${data.memes.map(number => `
            <div class="meme-frame">${makeMeme(number)}</div>
          `).join('')}
        </div>
        ${makeFooter(pageNumber)}
      </div>
    `;
  }

  return `
    <div class="page-inner article-page">
      ${makeHeader(pageNumber)}
      <div>
        <h2 class="article-title">${data.title}</h2>
        <div class="article-subtitle">${data.subtitle}</div>
      </div>
      <div class="meme-frame">${makeMeme(data.memes[0])}</div>
      ${makeFooter(pageNumber)}
    </div>
  `;
}

// Каждая физическая страница имеет лицевую и оборотную сторону.
const sheets = [];

for (let i = 0; i < pages.length; i += 2) {
  const sheet = document.createElement('div');
  sheet.className = 'sheet';

  const front = document.createElement('div');
  front.className = 'page front';
  front.innerHTML = makePage(pages[i], i + 1);

  const back = document.createElement('div');
  back.className = 'page back';

  if (pages[i + 1]) {
    back.innerHTML = makePage(pages[i + 1], i + 2);
  }

  sheet.append(front, back);
  book.appendChild(sheet);
  sheets.push(sheet);
}

let currentSheet = 0;
let isAnimating = false;

sheets.forEach((sheet, index) => {
  sheet.style.zIndex = sheets.length - index;
});

function updateBook() {
  sheets.forEach((sheet, index) => {
    sheet.classList.toggle('flipped', index < currentSheet);
    sheet.style.zIndex = index < currentSheet
      ? index + 1
      : sheets.length - index;
  });

  const currentPage = Math.min(currentSheet * 2 + 1, pages.length);
  counter.textContent = currentSheet === 0
    ? 'Обложка'
    : `${currentPage} / ${pages.length}`;

  prevButton.disabled = currentSheet === 0;
  nextButton.disabled = currentSheet >= sheets.length;

  progressBar.style.width =
    `${(currentSheet / sheets.length) * 100}%`;
}

function nextPage() {
  if (currentSheet >= sheets.length || isAnimating) return;
  currentSheet++;
  updateBook();
  isAnimating = true;
  setTimeout(() => isAnimating = false, 850);
}

function prevPage() {
  if (currentSheet <= 0 || isAnimating) return;
  currentSheet--;
  updateBook();
  isAnimating = true;
  setTimeout(() => isAnimating = false, 850);
}

nextButton.addEventListener('click', nextPage);
prevButton.addEventListener('click', prevPage);

document.addEventListener('keydown', event => {
  if (event.key === 'ArrowRight') nextPage();
  if (event.key === 'ArrowLeft') prevPage();
});

let touchStartX = 0;

book.addEventListener('touchstart', event => {
  touchStartX = event.changedTouches[0].screenX;
}, { passive: true });

book.addEventListener('touchend', event => {
  const delta = event.changedTouches[0].screenX - touchStartX;
  if (Math.abs(delta) < 45) return;
  if (delta < 0) nextPage();
  else prevPage();
}, { passive: true });

// Увеличение изображений.
const zoom = document.getElementById('zoom');
const zoomImage = document.getElementById('zoomImage');

book.addEventListener('click', event => {
  const img = event.target.closest('[data-zoom]');
  if (!img) return;

  zoomImage.src = img.src;
  zoom.classList.add('open');
});

zoom.addEventListener('click', () => {
  zoom.classList.remove('open');
  zoomImage.src = '';
});

updateBook();
</script>

</body>
</html>
