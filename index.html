<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f8f5ef">
  <title>Небольшой мемный архив</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap');

    :root {
      --paper: #faf8f2;
      --ink: #393a35;
      --muted: #85847c;
      --orange: #d98762;
      --green: #879b83;
      --pink: #e8c8c1;
      --line: #e8e2d7;
      --card: #fffefa;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background:
        radial-gradient(circle at 10% 10%, rgba(232, 200, 193, .18), transparent 24rem),
        radial-gradient(circle at 90% 35%, rgba(135, 155, 131, .12), transparent 28rem),
        var(--paper);
      color: var(--ink);
      font-family: 'Manrope', sans-serif;
      line-height: 1.6;
    }

    button {
      font: inherit;
    }

    .page {
      width: min(1100px, calc(100% - 36px));
      margin: 0 auto;
    }

    header {
      padding: 76px 0 48px;
      text-align: center;
      position: relative;
    }

    .eyebrow {
      display: inline-block;
      color: var(--green);
      font-family: 'Comfortaa', sans-serif;
      font-size: 12px;
      letter-spacing: .12em;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    h1 {
      font-family: 'Comfortaa', sans-serif;
      font-size: clamp(30px, 6vw, 54px);
      line-height: 1.2;
      font-weight: 700;
      margin: 0 auto 18px;
      max-width: 760px;
    }

    .intro {
      color: var(--muted);
      max-width: 570px;
      margin: 0 auto;
      font-size: 15px;
    }

    .doodle {
      position: absolute;
      font-size: 30px;
      opacity: .72;
      transform: rotate(-12deg);
      user-select: none;
    }

    .doodle.one {
      left: 8%;
      top: 72px;
    }

    .doodle.two {
      right: 9%;
      top: 112px;
      transform: rotate(13deg);
    }

    .doodle.three {
      right: 17%;
      bottom: 12px;
      font-size: 23px;
      transform: rotate(-8deg);
    }

    .batch {
      padding: 38px 0 48px;
      border-top: 1px dashed var(--line);
    }

    .batch-heading {
      display: flex;
      align-items: flex-start;
      gap: 15px;
      margin-bottom: 10px;
    }

    .batch-number {
      flex: 0 0 34px;
      width: 34px;
      height: 34px;
      border: 1px solid #d8c8b8;
      color: #a87961;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-family: 'Comfortaa', sans-serif;
      font-size: 13px;
      margin-top: 2px;
    }

    h2 {
      font-family: 'Comfortaa', sans-serif;
      font-size: clamp(21px, 3.5vw, 27px);
      line-height: 1.35;
      margin: 0;
      font-weight: 700;
    }

    .batch-caption {
      color: #77766e;
      margin: 0 0 24px 49px;
      max-width: 760px;
      font-size: 14px;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 17px;
      margin-left: 49px;
    }

    .meme {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 15px;
      padding: 10px;
      box-shadow: 0 4px 14px rgba(70, 59, 44, .035);
      min-width: 0;
      transition: transform .2s ease, box-shadow .2s ease;
      cursor: zoom-in;
    }

    .meme:hover {
      transform: translateY(-3px);
      box-shadow: 0 9px 22px rgba(70, 59, 44, .08);
    }

    .meme img {
      display: block;
      width: 100%;
      height: 245px;
      object-fit: contain;
      border-radius: 8px;
      background: #f5f1e9;
    }

    .meme-index {
      display: block;
      padding: 8px 3px 1px;
      color: #aaa397;
      font-size: 10px;
      letter-spacing: .08em;
    }

    footer {
      text-align: center;
      padding: 38px 0 58px;
      color: var(--muted);
      font-size: 13px;
      border-top: 1px dashed var(--line);
    }

    .footer-doodle {
      font-size: 27px;
      display: block;
      margin-bottom: 9px;
    }

    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 10;
      background: rgba(35, 34, 31, .88);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      cursor: zoom-out;
    }

    .lightbox.open {
      display: flex;
    }

    .lightbox img {
      max-width: min(100%, 1050px);
      max-height: 90vh;
      object-fit: contain;
      border-radius: 8px;
      box-shadow: 0 15px 60px rgba(0, 0, 0, .25);
    }

    .close {
      position: absolute;
      top: 18px;
      right: 22px;
      border: 0;
      background: transparent;
      color: white;
      font-size: 34px;
      cursor: pointer;
      line-height: 1;
    }

    @media (max-width: 760px) {
      header {
        padding: 60px 0 38px;
      }

      .doodle.one {
        left: 2%;
        top: 25px;
      }

      .doodle.two {
        right: 2%;
        top: 45px;
      }

      .doodle.three {
        display: none;
      }

      .gallery {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 11px;
        margin-left: 0;
      }

      .meme {
        padding: 7px;
        border-radius: 12px;
      }

      .meme img {
        height: 190px;
      }

      .batch-caption {
        margin-left: 0;
      }

      .batch {
        padding: 30px 0 36px;
      }
    }

    @media (max-width: 420px) {
      .page {
        width: min(100% - 24px, 1100px);
      }

      .gallery {
        gap: 8px;
      }

      .meme img {
        height: 160px;
      }

      .meme-index {
        font-size: 9px;
      }

      .batch-heading {
        gap: 10px;
      }

      .batch-number {
        flex-basis: 29px;
        width: 29px;
        height: 29px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      .meme {
        transition: none;
      }
    }
  </style>
</head>

<body>
  <div class="page">
    <header>
      <span class="doodle one">✿</span>
      <span class="doodle two">☁</span>
      <span class="doodle three">✧</span>

      <div class="eyebrow">маленький архив большого рабочего опыта</div>
      <h1>Мемы, которые многое объясняют</h1>
      <p class="intro">
        Собрала небольшую коллекцию рабочих наблюдений,
        жизненных ситуаций и других важных документов эпохи.
      </p>
    </header>

    <main id="content"></main>

    <footer>
      <span class="footer-doodle">☘</span>
      Пусть дальше будет больше хорошего и меньше срочного.
    </footer>
  </div>

  <div class="lightbox" id="lightbox" aria-label="Просмотр изображения">
    <button class="close" id="closeLightbox" aria-label="Закрыть">×</button>
    <img src="" alt="Увеличенное изображение" id="lightboxImage">
  </div>

  <script>
    const digests = [
      {
        title: "Работа мечты и прочие условия",
        caption: "Пчёлы в офисе, удалёнка в шаговой доступности, вакансии мечты и условия, которые мы заслужили. Где-то между всем этим — обычный рабочий день.",
        memes: [1, 6, 7, 8, 23]
      },
      {
        title: "Постановка задач: попробуй выполни",
        caption: "Когда задача звучит просто, критерии успеха туманны, а результат почему-то должен быть прекрасным. Отдельная благодарность за инициативу и умение разгоняться до завтра.",
        memes: [3, 25, 28, 29, 14]
      },
      {
        title: "Деньги, зарплата и другие ресурсы",
        caption: "Финансовая грамотность, налоги, зарплата и попытки разумно распорядиться тем, что осталось. Экономика — наука тонкая.",
        memes: [4, 15, 22, 26, 5]
      },
      {
        title: "Будущее уже наступило. Кажется",
        caption: "Искусственный интеллект, востребованные навыки, планы на пять лет и прочие вопросы, на которые пока нет единого ответа.",
        memes: [10, 11, 18, 27, 2]
      },
      {
        title: "Отдел психологической поддержки",
        caption: "Коты, свиньи и другие специалисты по восстановлению душевного равновесия. Работают без записи и не назначают совещаний.",
        memes: [9, 12, 16, 19, 20]
      },
      {
        title: "Когда слов уже недостаточно",
        caption: "Немного жизненной философии, немного абсурда и несколько изображений, которым не нужны дополнительные комментарии.",
        memes: [13, 17, 21, 24]
      }
    ];

    const content = document.getElementById('content');

    function imagePath(number) {
      const index = String(number).padStart(2, '0');
      const extension = number >= 27 ? 'jpg' : 'png';
      return `assets/meme-${index}.${extension}`;
    }

    digests.forEach((digest, index) => {
      const section = document.createElement('section');
      section.className = 'batch';

      const heading = document.createElement('div');
      heading.className = 'batch-heading';

      const number = document.createElement('div');
      number.className = 'batch-number';
      number.textContent = String(index + 1).padStart(2, '0');

      const title = document.createElement('h2');
      title.textContent = digest.title;

      heading.append(number, title);

      const caption = document.createElement('p');
      caption.className = 'batch-caption';
      caption.textContent = digest.caption;

      const gallery = document.createElement('div');
      gallery.className = 'gallery';

      digest.memes.forEach(memeNumber => {
        const card = document.createElement('div');
        card.className = 'meme';
        card.setAttribute('role', 'button');
        card.setAttribute('tabindex', '0');
        card.setAttribute('aria-label', `Открыть изображение ${memeNumber}`);

        const img = document.createElement('img');
        img.src = imagePath(memeNumber);
        img.alt = `Мем ${memeNumber}`;
        img.loading = 'lazy';

        const label = document.createElement('span');
        label.className = 'meme-index';
        label.textContent = `№ ${String(memeNumber).padStart(2, '0')}`;

        card.append(img, label);
        gallery.appendChild(card);

        const openImage = () => showLightbox(img.src);
        card.addEventListener('click', openImage);
        card.addEventListener('keydown', event => {
          if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault();
            openImage();
          }
        });
      });

      section.append(heading, caption, gallery);
      content.appendChild(section);
    });

    const lightbox = document.getElementById('lightbox');
    const lightboxImage = document.getElementById('lightboxImage');

    function showLightbox(src) {
      lightboxImage.src = src;
      lightbox.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      lightbox.classList.remove('open');
      lightboxImage.src = '';
      document.body.style.overflow = '';
    }

    lightbox.addEventListener('click', event => {
      if (event.target === lightbox) closeLightbox();
    });

    document.getElementById('closeLightbox').addEventListener('click', closeLightbox);

    document.addEventListener('keydown', event => {
      if (event.key === 'Escape') closeLightbox();
    });
  </script>
</body>
</html>
